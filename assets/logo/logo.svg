<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="50%" stop-color="#F5EBE1"/>
      <stop offset="100%" stop-color="#EAD7C5"/>
    </linearGradient>
    <linearGradient id="caramelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA15E"/>
      <stop offset="100%" stop-color="#BC6C25"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F4E37"/>
      <stop offset="100%" stop-color="#3A1F0D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE8959"/>
      <stop offset="100%" stop-color="#D9532F"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A1F0D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base container with rounded corners -->
  <rect x="20" y="20" width="360" height="360" rx="80" fill="url(#warmBg)" filter="url(#softShadow)" stroke="#DDA15E" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Calculator Screen Motif -->
  <rect x="75" y="75" width="250" height="70" rx="20" fill="url(#coffeeGrad)"/>
  <rect x="85" y="85" width="230" height="50" rx="14" fill="#2B1608" opacity="0.8"/>
  <!-- Digital Display dots / text -->
  <circle cx="110" cy="110" r="4" fill="#DDA15E"/>
  <circle cx="125" cy="110" r="4" fill="#DDA15E"/>
  <text x="290" y="117" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" fill="#F4A261" text-anchor="end" letter-spacing="1">HPP.Rp</text>

  <!-- Cupcake / Whisk Center Art -->
  <g transform="translate(200, 245)">
    <!-- Cupcake wrapper / base -->
    <path d="M-65,30 L-45,95 C-44,98 -40,100 -36,100 L36,100 C40,100 44,98 45,95 L65,30 Z" fill="url(#caramelGrad)"/>
    <!-- Pleats in cup -->
    <line x1="-35" y1="35" x2="-22" y2="95" stroke="#9A5016" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="35" x2="0" y2="98" stroke="#9A5016" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="35" x2="22" y2="95" stroke="#9A5016" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Frosted cream swirls -->
    <path d="M-75,30 C-85,15 -70,-5 -50,-5 C-45,-25 -15,-35 0,-30 C15,-35 45,-25 50,-5 C70,-5 85,15 75,30 C65,42 -65,42 -75,30 Z" fill="#FFFDF9" stroke="#EAD7C5" stroke-width="2"/>
    <path d="M-50,8 C-50,-12 -25,-25 0,-20 C25,-25 50,-12 50,8 C35,16 -35,16 -50,8 Z" fill="#FAF0E6"/>
    
    <!-- Cherry on top with profit sparkle -->
    <circle cx="0" cy="-35" r="15" fill="url(#accentGrad)"/>
    <path d="M4,-47 C12,-60 25,-65 32,-60" fill="none" stroke="#6F4E37" stroke-width="3" stroke-linecap="round"/>

    <!-- Mathematical / Calculator Key Buttons flanking -->
    <g transform="translate(-130, -50)">
      <rect x="0" y="0" width="42" height="42" rx="12" fill="#FFFFFF" stroke="#EAD7C5" stroke-width="2" filter="url(#softShadow)"/>
      <text x="21" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#6F4E37" text-anchor="middle">+</text>
      
      <rect x="0" y="55" width="42" height="42" rx="12" fill="#FFFFFF" stroke="#EAD7C5" stroke-width="2" filter="url(#softShadow)"/>
      <text x="21" y="81" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#6F4E37" text-anchor="middle">%</text>
    </g>

    <g transform="translate(88, -50)">
      <rect x="0" y="0" width="42" height="42" rx="12" fill="#FFFFFF" stroke="#EAD7C5" stroke-width="2" filter="url(#softShadow)"/>
      <text x="21" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#6F4E37" text-anchor="middle">×</text>
      
      <rect x="0" y="55" width="42" height="42" rx="12" fill="url(#caramelGrad)" filter="url(#softShadow)"/>
      <text x="21" y="82" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">=</text>
    </g>
  </g>
</svg>