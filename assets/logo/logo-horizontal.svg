<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hCaramel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA15E"/>
      <stop offset="100%" stop-color="#BC6C25"/>
    </linearGradient>
    <linearGradient id="hCoffee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E18"/>
      <stop offset="100%" stop-color="#2C1810"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="22" fill="#FAF6F0" stroke="#DDA15E" stroke-width="2"/>
    <rect x="18" y="18" width="44" height="20" rx="6" fill="#3A1F0D"/>
    <text x="54" y="32" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#DDA15E" text-anchor="end">HPP</text>
