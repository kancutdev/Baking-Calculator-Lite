    <path d="M26,50 L31,70 C31.5,71 33,72 35,72 L45,72 C47,72 48.5,71 49,70 L54,50 Z" fill="url(#hCaramel)"/>
    <circle cx="40" cy="38" r="4" fill="#E76F51"/>
  </g>

  <!-- Typography -->
  <g transform="translate(105, 45)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#hCoffee)" letter-spacing="-0.5">Baking Calculator</text>
    <rect x="250" y="-22" width="60" height="26" rx="8" fill="url(#hCaramel)"/>
    <text x="280" y="-4" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">LITE</text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8C6D58" letter-spacing="0.2">Hitung Modal • Tentukan Harga • Maksimalkan Profit</text>
